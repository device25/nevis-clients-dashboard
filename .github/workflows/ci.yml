name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm verify:compiler
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Fail if the history contains private or design files
        run: |
          if git log --all --name-only --pretty=format: | grep -E '\.pdf$|\.fig$|^\.private/'; then
            echo 'History contains a .pdf, .fig or .private/ path.'
            exit 1
          fi
